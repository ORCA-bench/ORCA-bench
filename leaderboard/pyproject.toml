[project]
name = "leaderboard"
version = "0.1.0"
description = "Tooling for building and verifying ORCA-bench leaderboard submissions."
requires-python = ">=3.14"
# No `[modal]` extra: ORCA-bench does not run the trajectory judge, which was
# the only thing that needed Modal.
dependencies = [
    "harbor>=0.20.0",
    "supabase>=2.31.0",
    "typer>=0.16",
]

# The user-side submission flow (SUBMIT.md): filter / metadata / open-prs
# / submit. CI-side modules run as `python -m leaderboard.ci.<module>`.
[project.scripts]
lb = "leaderboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaderboard"]
