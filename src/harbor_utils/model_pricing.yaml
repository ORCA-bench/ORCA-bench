# Anthropic API Pricing - Text Only (per 1M tokens)
# Source: Gradient AI / Anthropic model documentation
# Date: 2026-04-29
#
# notes:
#   - All prices are in USD per 1 million tokens
#   - input/output are the ≤200K-token-prompt rates; *_over_200k apply when the
#     prompt exceeds 200K tokens (only set on models that publish a tiered rate)
#   - context_cache_read is the cache-hit rate; cache_creation_5m and
#     cache_creation_1h are the write rates for 5-minute and 1-hour TTLs
#   - max_output_tokens, context_window, and end_of_support are model metadata
#   - end_of_support is "no sooner than" the listed date (YYYY-MM or YYYY-MM-DD)

