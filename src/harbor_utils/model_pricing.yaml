# Gemini API Pricing - Text Only (per 1M tokens, ≤200k context)
# Source: https://ai.google.dev/gemini-api/docs/pricing
# Date: 2026-01-18
#
# notes:
#   - All prices are in USD per 1 million tokens
#   - Pricing assumes ≤200k token context (some models have higher pricing for >200k)
#   - Context caching reduces input costs by 10-16x for most models
#   - Context cache storage is charged per hour per 1M tokens stored
#   - Audio input pricing differs and is not included here
#   - Free tier has different limitations and pricing

gemini-3-pro-preview:
  input: 2.00
  output: 12.00
  context_cache_read: 0.20
  context_cache_storage_per_hour: 4.50
  average_input_output: 7.00

gemini-3-flash-preview:
  input: 0.50
  output: 3.00
  context_cache_read: 0.05
  context_cache_storage_per_hour: 1.00
  average_input_output: 1.75

gemini-2.5-pro:
  input: 1.25
  output: 10.00
  context_cache_read: 0.125
  context_cache_storage_per_hour: 4.50
  average_input_output: 5.63

gemini-2.5-flash:
  input: 0.30
  output: 2.50
  context_cache_read: 0.03
  context_cache_storage_per_hour: 1.00
