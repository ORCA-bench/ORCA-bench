# OpenAI API Pricing via Gradient AI - Text Only (per 1M tokens)
# Source: Gradient AI / OpenAI model documentation
# Date: 2026-04-29
#
# notes:
#   - All prices are in USD per 1 million tokens
#   - Keyed by Gradient model ID (e.g. openai-gpt-5.2)
#   - OpenAI billing is flat: no >200K tier, no cache-write charge
#   - cached_input covers prompt-cache reads (~10% of input rate)
#   - Bare-name aliases (gpt-5.2, gpt-5, gpt-5-mini, gpt-5-nano) reuse the
#     Gradient entry via YAML anchors so older recorded model_name values still
#     resolve in calculate_cost (which only strips "/" prefixes, not "-")

openai-gpt-5.4:
  input: 2.50
  output: 15.00
  cached_input: 0.25
  max_output_tokens: 128000
  context_window: 1000000

