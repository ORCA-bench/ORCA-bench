# Harbor job config for the published orca-bench dataset.
# Full harbor-template environment (telemetry + code).
#
# Run with (snapshot image must match the harbor-template environment):
#   SNAPSHOT_IMAGE=orcabench/sre-otel-snapshot:data-0418-harbor-template \
#       ./run_harbor_cached.sh -c configs/harbor_job_orca_bench.yaml

# job_name: orca-bench
jobs_dir: jobs
n_concurrent_trials: 30
n_attempts: 1

# SNAPSHOT_CACHE_HOST_DIR is exported by run_harbor_cached.sh after staging
# the snapshot image to a host-side cache. It propagates to the agent
# container via the harbor process env -> docker-compose subprocess env ->
# the task's docker-compose.yaml `${SNAPSHOT_CACHE_HOST_DIR:-}` passthrough
# (no JobConfig.environment.env entry needed; that would inject a literal
# `${...}` template since job-level env doesn't pass through resolve_env_vars).
# The harbor-template entrypoint requires this var to be set; running plain
# `harbor run` (without the wrapper) will fail fast with a clear error.

agents:
  - name: terminus-2
    model_name: gradient_ai/anthropic-claude-4.6-sonnet
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/anthropic-claude-opus-4.7
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/openai-gpt-5.5
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/glm-5
    kwargs:
      temperature: 1
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/deepseek-v4-pro
    kwargs:
      temperature: 1
      llm_kwargs:
        max_tokens: 16384

datasets:
  - registry_url: https://huggingface.co/datasets/orca-bench/orca-bench-harbor-tasks/resolve/main/registry.json
    name: orca-bench-harbor-tasks
    version: v0.0.0
    task_names:
      - "*"
