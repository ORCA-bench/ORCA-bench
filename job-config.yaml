# Harbor job config for ORCA-bench leaderboard runs.
#
# Run with:
#
#   export OPENAI_API_KEY=...   # REQUIRED: the verifier is an LLM judge
#   export OPENAI_BASE_URL=...  # picks the judge/oracle model. One of
#     https://api.openai.com/v1 (default) -> gpt-5.4
#     https://inference.do-ai.run/v1      -> openai-gpt-5.4
#     https://openrouter.ai/api/v1        -> openai/gpt-5.4
#   SNAPSHOT_IMAGE=orcabench/sre-otel-snapshot:data-0418-harbor-template-v2 \
#       ./run_harbor_cached.sh -c job-config.yaml --upload --public
#
# REQUIRED for a submission:
#   --upload --public   the leaderboard reads trials from the hub, and CI needs
#                       them publicly readable.
#
#
# SNAPSHOT_CACHE_HOST_DIR is exported by run_harbor_cached.sh after staging
# the snapshot image to a host-side cache. It propagates to the agent
# container via the harbor process env -> docker-compose subprocess env ->
# the task's docker-compose.yaml `${SNAPSHOT_CACHE_HOST_DIR:-}` passthrough
# (no JobConfig.environment.env entry needed; that would inject a literal
# `${...}` template since job-level env doesn't pass through resolve_env_vars).
# The harbor-template entrypoint requires this var to be set; running plain
# `harbor run` (without the wrapper) will fail fast with a clear error.

# job_name: orca-bench
jobs_dir: jobs

# REQUIRED for a leaderboard submission: a timeout multiplier of exactly 1.0.
# CI also rejects any agent/verifier timeout override or resource override —
# those are what would make a score incomparable.
timeout_multiplier: 1.0

# Trials per task. MIN_TRIALS_PER_TASK in leaderboard/ci/static_analysis.py is
# the floor CI enforces; raising this tightens the error bars (and switches the
# ± SE column from the between-task to the within-task estimator).
n_attempts: 1

# OPTIONAL: concurrency. Each trial runs a privileged docker-in-docker
# otel-demo stack, so this is bounded by host resources, not model rate limits.
n_concurrent_trials: 30

# The reference agents. Override on the CLI with -a/-m to submit your own.
agents:
  - name: terminus-2
    model_name: gradient_ai/anthropic-claude-4.6-sonnet
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/anthropic-claude-opus-4.7
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/openai-gpt-5.5
    kwargs:
      temperature: 1
      reasoning_effort: "medium"
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/glm-5
    kwargs:
      temperature: 1
      llm_kwargs:
        max_tokens: 16384
  - name: terminus-2
    model_name: gradient_ai/deepseek-v4-pro
    kwargs:
      temperature: 1
      llm_kwargs:
        max_tokens: 16384

# REQUIRED: the dataset this leaderboard tracks, as published on the Harbor
# Hub. Keep in lockstep with DATASET in leaderboard/src/leaderboard/core/hub.py.
datasets:
  - name: orca-bench/orca-bench
    version: latest
