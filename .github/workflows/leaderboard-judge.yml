name: LLM Judge

# Maintainer comments on a promoted submission PR:
#
#   /judge                          score every trial that has no verdict yet
#   /judge force                    regrade every trial
#   /judge <size> <number>          one batch (trials sorted by id, 1-indexed;
#                                   number defaults to 1), unscored trials only
#   /judge <size> <number> force    regrade that batch
#
# The committed scores file (leaderboard/scores/<submission>.json on the bot
# branch) is seeded into the judge's output dir first, so run_llm_judge's own
# skip-if-scored rule applies in CI exactly as it does locally: a trial with a
# non-error record is skipped unless `force`, and a trial whose record is an
# error mode is always re-scored. Whatever this run judges is then MERGED back
# into the committed file -- those trials' records are replaced, every other
# trial's record is kept -- so a batch run regrades that batch and leaves the
# rest as they were, and a plain `/judge` after a partial run judges only what
# is missing.
#
# This exists for the held-out split: `orca-bench/orca-bench-private` tasks ship
# without expected.json or rubrics/ and cannot be scored in-container (see
# build_harbor_tasks.py), so their reward has to be produced here, against the
# oracle twin's ground truth. Public-split trials are already scored by their
# own verifier; judging them here is a re-score, not the normal path.
#
# Gated to write-access commenters because this is the only workflow holding
# OPENAI_API_KEY: `promote` runs on any fork PR that passes static analysis, so
# an automatic trigger would hand contributor-controlled spend (one judge call
# per trial, at effort=high) to whoever opens a valid submission.
on:
  issue_comment:
    types: [created]

concurrency:
  group: judge-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write        # pushes the per-trial scores to the bot branch
  pull-requests: write
  issues: write

jobs:
  judge:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/judge') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      # /judge runs only on the promoted, repo-owned submission PR (head
      # submission/pr-N), which references the leaderboard-owned trial clones.
      # Intake (fork) PRs are auto-promoted and closed, so judging one would
      # score the submitter's un-cloned trials -- which they can still mutate or
      # delete out from under the run.
      - name: Only run on promoted (bot) PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')
          if [[ "$ref" != submission/pr-* ]]; then
            echo "::warning::/judge runs only on promoted bot PRs (head submission/pr-N); this PR head is '$ref'."
            exit 1
          fi

      - name: Acknowledge (👀)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes

      # Base branch = trusted code. The submission JSON below is read as data.
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.14"

      # The root project, not leaderboard/: run_llm_judge imports utils and
      # check_prediction, which pull harbor, openai, pandas and scipy.
      - name: Install dependencies
        run: uv sync

      - name: Fail early if the judge has no credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::OPENAI_API_KEY is not set"; exit 1; }
          [ -n "$HARBOR_API_KEY" ] || { echo "::error::HARBOR_API_KEY is not set"; exit 1; }

      - name: Resolve the submission's jobs
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}   # via env, never inlined into the shell
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.sha')
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          path=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
            --jq '[.[] | select((.filename | test("^leaderboard/submissions/[A-Za-z0-9._-]+\\.json$")) and (.status != "removed")) | .filename] | first // empty')
          if [ -z "$path" ]; then echo "::error::no submission JSON on this PR"; exit 1; fi
          echo "sub_path=$path" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/contents/$path?ref=$HEAD_SHA" \
            --jq '.content' | base64 -d > /tmp/submission.json

          # source_jobs are contributor-derived and go straight into a command
          # line, so accept only bare UUIDs -- the same discipline the static
          # analysis workflow applies to the submission path.
          jq -r '.source_jobs[]' /tmp/submission.json \
            | sed 's#.*/##' \
            | grep -Ex '[0-9a-fA-F-]{36}' > /tmp/jobs.txt \
            || { echo "::error::source_jobs contains a value that is not a bare UUID"; exit 1; }
          n=$(wc -l < /tmp/jobs.txt)
          [ "$n" -gt 0 ] || { echo "::error::submission lists no source_jobs"; exit 1; }
          echo "Judging $n job(s) from $path"
          { echo "args<<EOF"; sed 's/^/--job /' /tmp/jobs.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"

          # Arguments: "/judge [<batch_size> [<batch_number>]] [force]", first
          # line of the comment only. Each token must be a bare integer or the
          # word `force`; anything else fails the run rather than silently
          # judging everything. The body is read via env and split with
          # `read` (no globbing), so nothing in it reaches the command line
          # except validated integers. run_llm_judge rejects an out-of-range
          # batch itself.
          first=$(printf '%s' "$BODY" | head -1 | tr -d '\r' | sed -E 's#^/judge##')
          read -ra TOK <<< "$first"
          BS=""; BN=""; FORCE=""
          for t in "${TOK[@]}"; do
            case "$t" in
              force) FORCE="--force" ;;
              ''|*[!0-9]*)
                echo "::error::unrecognised /judge argument '$t' (usage: /judge [<batch_size> [<batch_number>]] [force])"
                exit 1 ;;
              *)
                if [ -z "$BS" ]; then BS=$t
                elif [ -z "$BN" ]; then BN=$t
                else echo "::error::too many numbers in '/judge$first'"; exit 1; fi ;;
            esac
          done
          if [ -n "$BS" ]; then
            BN="${BN:-1}"
            echo "limit=--batch-size $BS --batch-number $BN" >> "$GITHUB_OUTPUT"
            echo "batch=batch $BN of size $BS" >> "$GITHUB_OUTPUT"
          else
            echo "limit=" >> "$GITHUB_OUTPUT"
            echo "batch=all trials" >> "$GITHUB_OUTPUT"
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "Scope: $( [ -n "$BS" ] && echo "batch $BN of size $BS" || echo "all trials" )$( [ -n "$FORCE" ] && echo ", regrading" )"

          # Seed the judge's output dir with the committed scores so its
          # skip-if-scored rule (and --force) work in CI as they do locally.
          # A record is written under the file name run_llm_judge would use
          # for that trial at the record's own model/effort; a record judged
          # by a different model than the current default therefore does not
          # match and is re-scored, which is the right outcome.
          scores="leaderboard/scores/$(basename "$path")"
          mkdir -p /tmp/judge/scores
          if gh api "repos/${{ github.repository }}/contents/$scores?ref=$HEAD_SHA" \
               --jq '.content' 2>/dev/null | base64 -d > /tmp/existing-scores.json \
             && [ -s /tmp/existing-scores.json ]; then
            uv run python - "$scores" <<'PY'
          import json, sys
          from pathlib import Path
          records = json.loads(Path("/tmp/existing-scores.json").read_text())
          for tid, rec in records.items():
              name = f"judge-{rec.get('model')}-{rec.get('reasoning_effort') or 'none'}-{tid}.json"
              (Path("/tmp/judge/scores") / name).write_text(json.dumps(rec, indent=2))
          print(f"Seeded {len(records)} existing record(s) from {sys.argv[1]}")
          PY
          else
            rm -f /tmp/existing-scores.json
            echo "No committed scores yet; every trial is unscored"
          fi
          # Anything the judge writes from here on is newer than this marker.
          touch /tmp/judge/.started

      # Model and effort are left at the script's defaults (openai-gpt-5.4,
      # effort high) so these scores match what the public split's in-container
      # verifier produced.
      - name: Run the judge
        id: judge
        continue-on-error: true
        env:
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          uv run python run_llm_judge.py -od /tmp/judge \
            ${{ steps.jobs.outputs.args }} \
            ${{ steps.jobs.outputs.limit }} \
            ${{ steps.jobs.outputs.force }}

      # One file per submission, mirroring leaderboard/submissions/<name>.json,
      # keyed by trial id. Committed to the bot branch so the maintainer reviews
      # the scores on the same PR and merging carries them to main.
      #
      # Safe to publish because the payload is exactly what the in-container
      # verifier persists to reward.json -- run_llm_judge builds it with
      # check_prediction.build_rewards, so it is the reward plus whichever of
      # rca_accuracy / hallucinate_any is defined, and nothing else. Every field
      # that names the answer is absent by construction: flag, nested,
      # judge_prompt, judge_response_raw, reasoning_summary, per_rubric. The
      # guard below re-checks for them anyway, so a change that puts one back in
      # the payload fails here instead of publishing the held-out answers.
      #
      # A GITHUB_TOKEN push does not re-trigger workflows, which is the same
      # property the promote job relies on.
      - name: Save per-trial scores to the repo
        id: save
        if: steps.judge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          SUB_PATH: ${{ steps.jobs.outputs.sub_path }}
        run: |
          set -euo pipefail
          BOT_BRANCH=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')
          dest="leaderboard/scores/$(basename "$SUB_PATH")"
          git fetch --depth=1 origin "$BOT_BRANCH"
          git checkout -B "$BOT_BRANCH" FETCH_HEAD
          mkdir -p leaderboard/scores

          # Merge what this run judged into the committed file: a trial judged
          # in this run replaces its old record, every other trial keeps its
          # record. Only files newer than the .started marker are this run's
          # -- the rest were seeded from the committed file and are unchanged.
          uv run python - "$dest" <<'PY'
          import json, sys
          from pathlib import Path

          out = Path(sys.argv[1])
          records = json.loads(out.read_text()) if out.is_file() else {}
          n_before = len(records)
          n_new = 0
          started = Path("/tmp/judge/.started").stat().st_mtime
          for p in sorted(Path("/tmp/judge/scores").glob("*.json")):
              if p.stat().st_mtime <= started:
                  continue
              d = json.loads(p.read_text())
              tid = d.get("trial_id")
              if not tid:
                  sys.exit(f"{p.name} has no trial_id")
              # Belt and braces: the payload is built redacted, but this file is
              # about to be committed, so refuse rather than publish a field that
              # names the answer.
              banned = {"flag", "nested", "judge_prompt", "judge_response_raw",
                        "reasoning_summary", "per_rubric"}
              leaked = banned & d.keys()
              if leaked:
                  sys.exit(f"{p.name} carries {sorted(leaked)}; refusing to commit")
              records[tid] = d
              n_new += 1
          out.write_text(json.dumps(dict(sorted(records.items())), indent=2) + "\n")
          print(f"{n_new} trial(s) judged in this run; {out} now holds {len(records)} "
                f"record(s) (was {n_before})")
          with open("/tmp/scores-count.txt", "w") as fh:
              fh.write(f"{n_new} {len(records)}")
          PY

          git add "$dest"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          read -r n_new n_total < /tmp/scores-count.txt
          echo "n_new=$n_new" >> "$GITHUB_OUTPUT"
          echo "n_total=$n_total" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "scores unchanged; nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Judge scores for $(basename "$SUB_PATH" .json) ($n_new trial(s) judged; $n_total on file)" \
                     -m "Written by /judge from run #${{ github.run_id }}."
          git push origin "$BOT_BRANCH"
          echo "Committed $dest to $BOT_BRANCH"

      # The private board's metrics come from these scores, not from the trials
      # (which carry none), so they are written here rather than at promote.
      # static_analysis refuses unless the scores cover every trial of the
      # submission, so a partial judge run leaves the submission without
      # metrics and the merge step will not post it; re-run /judge instead.
      - name: Write the metrics into the submission
        id: metrics
        if: steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HARBOR_API_KEY: ${{ secrets.HARBOR_API_KEY }}
          PR: ${{ github.event.issue.number }}
          SUB_PATH: ${{ steps.jobs.outputs.sub_path }}
          SCORES: ${{ steps.save.outputs.dest }}
        run: |
          set -euo pipefail
          uv sync --project leaderboard
          uv run --project leaderboard python -m leaderboard.ci.static_analysis \
            "$SUB_PATH" --scores "$SCORES" --write-metrics | tee /tmp/metrics.json
          git add "$SUB_PATH"
          if git diff --cached --quiet; then
            echo "metrics unchanged; nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Metrics for $(basename "$SUB_PATH" .json) from the judge scores" \
                     -m "Written by /judge from run #${{ github.run_id }}."
          git push origin "$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')"

      # Counts and aggregates only -- no per-trial detail is quoted, since the
      # comment is readable by anyone who can see the PR.
      #
      # judge_prompts/ is the one judge output that does embed the rubric
      # verbatim, so it must never be uploaded as an artifact: artifacts are
      # downloadable by anyone with read access to this repo, and the held-out
      # split exists so those answers do not circulate. scores/ is safe -- see
      # the save step above.
      #
      # always(), so a failed run still reports what it managed to score
      # rather than leaving the PR with only a red check.
      - name: Summarize
        if: always()
        env:
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          METRICS_OUTCOME: ${{ steps.metrics.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SAVED_TO: ${{ steps.save.outputs.dest }}
          SUB_PATH: ${{ steps.jobs.outputs.sub_path }}
          BATCH: ${{ steps.jobs.outputs.batch }}
          FORCE: ${{ steps.jobs.outputs.force }}
          N_TOTAL: ${{ steps.save.outputs.n_total }}
        run: |
          uv run python - <<'PY' > /tmp/comment.md
          import json
          import os
          from collections import Counter
          from pathlib import Path

          # Control tasks (mode no_incident_llm_judge) have no root cause to find,
          # so they are kept out of the incident metrics -- the same split the
          # leaderboard's published subsets make. `empty_report` is NOT a control:
          # it is an incident trial whose agent wrote nothing, and it scores 0.
          CONTROL = "no_incident_llm_judge"
          ERRORS = ("llm_judge_error", "hub_fetch_error")

          # Only this run's files: the rest were seeded from the committed
          # scores and are summarized by the "on file" count instead.
          marker = Path("/tmp/judge/.started")
          started = marker.stat().st_mtime if marker.exists() else 0
          paths = sorted(
              p for p in Path("/tmp/judge/scores").glob("*.json")
              if p.stat().st_mtime > started
          )
          modes, rewards, acc, hall = Counter(), [], [], []
          n_control = n_retried = 0
          for p in paths:
              d = json.loads(p.read_text())
              mode = d.get("mode", "?")
              modes[mode] += 1
              if mode in ERRORS:
                  continue
              # run_llm_judge records `attempts` only when a trial needed more
              # than one draw, so this counts the flaky ones.
              if d.get("attempts", 1) > 1:
                  n_retried += 1
              if mode == CONTROL:
                  n_control += 1
                  continue
              rewards.append(d.get("reward") or 0.0)
              # The payload is what the verifier persists to reward.json: the
              # reward, plus whichever rollups are defined. An undefined one is
              # absent rather than null, so .get() covering both is the check.
              for key, sink in (("rca_accuracy", acc), ("hallucinate_any", hall)):
                  if d.get(key) is not None:
                      sink.append(bool(d[key]))

          def pct(xs):
              return f"{100 * sum(xs) / len(xs):.2f}% (n={len(xs)})" if xs else "—"

          n_err = sum(v for k, v in modes.items() if k in ERRORS)
          outcome = os.environ.get("JUDGE_OUTCOME", "")
          out = []
          if outcome != "success":
              # Without this a failed run reads as "0 trials scored, all fine".
              out.append(
                  f"❌ **LLM Judge** — the run did not finish (`{outcome}`). See the "
                  f"[log]({os.environ.get('RUN_URL', '')}). Partial results below.\n"
              )
          scope = os.environ.get("BATCH") or "all trials"
          if os.environ.get("FORCE"):
              scope += ", regraded"
          out.append(f"**LLM Judge** — {scope}: {len(paths)} trial(s) judged, {n_err} errored\n")
          out.append("| Mode | Count |\n| --- | ---: |")
          out += [f"| `{m}` | {c} |" for m, c in modes.most_common()]
          out.append("")
          out.append("| Metric | Value |\n| --- | --- |")
          out.append(
              f"| Mean reward (incident) | {sum(rewards)/len(rewards):.3f} |"
              if rewards else "| Mean reward (incident) | — |"
          )
          out.append(f"| RCA accuracy (incident) | {pct(acc)} |")
          out.append(f"| Hallucination rate (incident) | {pct(hall)} |")
          out.append(f"| Control trials (excluded above) | {n_control} |")
          out.append(f"| Trials that needed a retry | {n_retried} |")
          out.append(
              "\n<sub>Judged with the same model and reasoning effort as the "
              "in-container verifier. Per-trial rollups carry no root cause and "
              "no rubric; the judge prompts, which do, stay on the runner.</sub>"
          )
          saved = os.environ.get("SAVED_TO")
          if saved:
              total = os.environ.get("N_TOTAL")
              out.insert(1, f"Per-trial scores merged into `{saved}` on this branch"
                            + (f" — {total} record(s) on file." if total else ".") + "\n")
          # The leaderboard's own numbers, as static_analysis computed them from
          # the scores and wrote them into the submission (or why it did not).
          metrics_outcome = os.environ.get("METRICS_OUTCOME", "")
          if metrics_outcome == "success":
              try:
                  m = json.loads(Path("/tmp/metrics.json").read_text())
                  out.append(
                      f"\n**Leaderboard metrics** written into `{os.environ.get('SUB_PATH')}`:\n"
                  )
                  out.append("| Metric | Result |\n| --- | --- |")
                  out += [
                      f"| {k.removesuffix('_display')} | {v} |"
                      for k, v in m.items() if k.endswith("_display")
                  ]
              except (OSError, ValueError):
                  out.append("\nLeaderboard metrics were written into the submission.")
          elif metrics_outcome == "failure":
              out.append(
                  "\n❌ **Leaderboard metrics not written** — the scores do not cover "
                  "every trial (see the log); re-run `/judge` before merging."
              )
          print("\n".join(out))
          PY
          cat /tmp/comment.md

      - name: Post the summary
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          number: ${{ github.event.issue.number }}
          header: llm-judge
          path: /tmp/comment.md

      # continue-on-error above kept the summary reachable; the job itself must
      # still go red so the PR does not look judged when it is not. The same
      # for the metrics: a judged-but-unscored submission is not mergeable.
      - name: Fail if the judge failed
        if: steps.judge.outcome != 'success' || steps.metrics.outcome == 'failure'
        run: exit 1
